name: Austria GTFS - Publish Feeds

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: austria-gtfs-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and publish Austrian GTFS feeds
        env:
          DBP_USERNAME: ${{ secrets.DBP_USERNAME }}
          DBP_PASSWORD: ${{ secrets.DBP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/download_gtfs.py

      - name: Upload workflow logs and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: austria-gtfs-run
          path: |
            output/metadata.json
          retention-days: 7
          if-no-files-found: ignore