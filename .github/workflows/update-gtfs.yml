name: Austria GTFS - Dataset Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrieve datasets
        env:
          DBP_USERNAME: ${{ secrets.DBP_USERNAME }}
          DBP_PASSWORD: ${{ secrets.DBP_PASSWORD }}
        run: python scripts/list_datasets.py

      - name: Upload dataset list
        uses: actions/upload-artifact@v4
        with:
          name: austria-datasets
          path: site/datasets.json
          retention-days: 7